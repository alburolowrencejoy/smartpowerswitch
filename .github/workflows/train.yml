name: Train LSTM and Publish Forecast

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run training script
        env:
          # This service account must be allowed to read/write the Realtime
          # Database (role "Firebase Realtime Database Admin").
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTPOWERSWITCH_E90D0 }}
          # The database URL isn't secret; the secret, if set, still wins.
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL || 'https://smartpowerswitch-e90d0-default-rtdb.asia-southeast1.firebasedatabase.app' }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          python tools/train_and_push.py
      - name: Upload TFLite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-model
          path: models/forecast.tflite
          if-no-files-found: ignore
