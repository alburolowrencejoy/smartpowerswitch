name: Train Forecast Models and Publish Comparison

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC (10:00 Philippine time)
  workflow_dispatch: {}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the forecast job
        run: python -m pytest tools/test_forecast_comparison.py -q
      - name: Run ARIMA / XGBoost / GRU / LSTM comparison
        env:
          # A service-account key that can read/write the Realtime Database
          # of project smartpowerswitch-e90d0. Preferred: FIREBASE_TRAINER_KEY
          # (Firebase Console > Project settings > Service accounts >
          # Generate new private key). The hosting-deploy key is only a
          # fallback and usually lacks database access.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TRAINER_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_SMARTPOWERSWITCH_E90D0 }}
          # The database URL isn't secret; the secret, if set, still wins.
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL || 'https://smartpowerswitch-e90d0-default-rtdb.asia-southeast1.firebasedatabase.app' }}
        run: |
          python tools/forecast_comparison.py
      - name: Upload comparison tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison
          path: outputs/*.csv
          if-no-files-found: ignore
