<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SmartSwitch Phone Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>body{margin:0}:root{--green-dark:#1a5c35;--green-mid:#2e9e52;--green-light:#6ecb8a;--green-pale:#c2edd0;--green-wash:#e6f5eb;--surface:#f4fbf6;--card:#ffffff;--line:#dcebe1;--ink:#0e2e1a;--ink-mid:#3a6b4a;--ink-muted:#4f6a58;--ink-disabled:#9aaea1;--on-brand:#ffffff;--on-brand-soft:#d8f0e0;--success:#2e9e52;--success-text:#1f7a40;--warning:#e8922a;--warning-text:#a15208;--warning-bg:#fdf1e2;--error:#d64a4a;--error-text:#b42318;--error-bg:#fdecea;--offline:#8a948d;--ic-dark:#351a5c;--ic-mid:#5d2e9e;--ic-pale:#d4c2ed;--ilegg-dark:#5c1a25;--ilegg-mid:#9e2e41;--ilegg-pale:#edc2c9;--ited-dark:#5c4b1a;--ited-mid:#9e822e;--ited-pale:#ede2c2;--iaas-dark:#1a3b5c;--iaas-mid:#2e669e;--iaas-pale:#c2d8ed;--chart-arima:#1a5c35;--chart-xgb:#2e669e;--chart-lstm:#a15208;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--touch:48px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--shadow-card:0 1px 2px rgba(14,46,26,0.06);--shadow-hero:0 8px 20px rgba(26,92,53,0.25);--shadow-sheet:0 -8px 24px rgba(14,46,26,0.16);--font-sans:Roboto,system-ui,sans-serif;}
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap');

/* SmartSwitch mobile mockup kit. Every colour, length and radius comes from tokens.css. */
.sps, .sps * { box-sizing: border-box; }
body { margin: 0; background: transparent; }
.sps { font-family: var(--font-sans, Roboto, system-ui, sans-serif); color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1; }
.sps-stage { display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 16px; flex-wrap: wrap; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; width: 1em; height: 1em; overflow: hidden; flex: none; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0; user-select: none; }
.ms.fill { font-variation-settings: 'FILL' 1; }
.ms.s18 { font-size: 18px; } .ms.s20 { font-size: 20px; } .ms.s28 { font-size: 28px; }

/* Phone */
.phone { width: 360px; height: 800px; border-radius: 36px; background: var(--surface); border: 8px solid #101a14; box-shadow: 0 12px 40px rgba(14,46,26,.18); overflow: hidden; position: relative; display: flex; flex-direction: column; flex: none; }
.phone-caption { font: 600 14px/20px var(--font-sans); color: var(--ink-mid); text-align: center; margin-top: 10px; }
.statusbar { height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font: 600 12px/16px var(--font-sans); color: var(--on-brand); background: var(--green-dark); }
.statusbar.light { background: var(--surface); color: var(--ink); }
.statusbar .ms { font-size: 16px; }

/* Top bar */
.topbar { flex: none; background: var(--green-dark); color: var(--on-brand); padding: 8px 8px 12px 16px; display: flex; align-items: center; gap: 4px; min-height: 64px; }
.topbar .tb-titles { flex: 1; min-width: 0; }
.topbar h1 { margin: 0; font: 700 22px/28px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .tb-sub { font: 400 14px/20px var(--font-sans); color: var(--on-brand-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar.small h1 { font-size: 18px; line-height: 24px; font-weight: 600; }
.icon-btn { width: 48px; height: 48px; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; position: relative; color: inherit; flex: none; }
.icon-btn .badge { position: absolute; top: 6px; right: 5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--warning); color: var(--ink); font: 700 12px/20px var(--font-sans); text-align: center; border: 2px solid var(--green-dark); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--green-pale); color: var(--green-dark); font: 700 14px/36px var(--font-sans); text-align: center; flex: none; margin: 0 6px; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 16px 16px 24px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }
.section { margin-top: 24px; }
.section:first-child { margin-top: 0; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font: 600 18px/24px var(--font-sans); color: var(--ink); }
.sec-head .sub { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); margin-top: 2px; }
.link { font: 600 14px/20px var(--font-sans); color: var(--green-dark); display: inline-flex; align-items: center; gap: 2px; min-height: 48px; margin: -14px 0; white-space: nowrap; }
.link .ms { font-size: 18px; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px; }
.card + .card { margin-top: 12px; }
.card-title { font: 600 16px/22px var(--font-sans); margin: 0; }
.card-sub { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); margin-top: 2px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }

/* Hero */
.hero { border-radius: var(--radius-xl); padding: 20px; color: var(--on-brand); background: linear-gradient(135deg, var(--green-dark), #236f40); box-shadow: var(--shadow-hero); position: relative; overflow: hidden; }
.hero .h-label { font: 500 14px/20px var(--font-sans); color: var(--on-brand-soft); display: flex; align-items: center; justify-content: space-between; }
.hero .h-value { font: 700 36px/40px var(--font-sans); margin-top: 6px; letter-spacing: -.5px; }
.hero .h-value small { font: 500 16px/22px var(--font-sans); color: var(--on-brand-soft); margin-left: 4px; letter-spacing: 0; }
.hero .h-delta { font: 500 14px/20px var(--font-sans); color: var(--on-brand-soft); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.hero .h-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.hero .h-cell { background: rgba(255,255,255,.1); border-radius: var(--radius-md); padding: 10px; }
.hero .h-cell b { display: block; font: 700 16px/22px var(--font-sans); }
.hero .h-cell span { font: 500 12px/16px var(--font-sans); color: var(--on-brand-soft); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/16px var(--font-sans); padding: 4px 10px; border-radius: var(--radius-pill); background: rgba(255,255,255,.14); color: var(--on-brand); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green-light); box-shadow: 0 0 0 3px rgba(110,203,138,.3); }
.live.on-light { background: var(--green-wash); color: var(--success-text); }
.live.on-light i { background: var(--success); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; }
.kpi .k-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--green-wash); color: var(--green-dark); display: flex; align-items: center; justify-content: center; }
.kpi .k-icon .ms { font-size: 20px; }
.kpi .k-label { font: 500 14px/20px var(--font-sans); color: var(--ink-mid); margin-top: 10px; }
.kpi .k-value { font: 700 22px/28px var(--font-sans); color: var(--ink); margin-top: 2px; white-space: nowrap; }
.kpi .k-value small { font: 500 14px/20px var(--font-sans); color: var(--ink-muted); margin-left: 2px; }
.kpi .k-foot { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); margin-top: 4px; display: flex; align-items: center; gap: 2px; }
.up { color: var(--error-text) !important; } .down { color: var(--success-text) !important; }

/* Chips / pills */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--card); font: 600 14px/20px var(--font-sans); color: var(--ink); white-space: nowrap; }
.chip .ms { font-size: 18px; color: var(--ink-mid); }
.chip.on { background: var(--green-pale); border-color: var(--green-pale); color: var(--green-dark); }
.chip.on .ms { color: var(--green-dark); }
.chip.solid { background: var(--green-dark); border-color: var(--green-dark); color: var(--on-brand); }
.chip.solid .ms { color: var(--on-brand); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: var(--radius-pill); font: 600 12px/16px var(--font-sans); white-space: nowrap; }
.pill.ok { background: var(--green-wash); color: var(--success-text); }
.pill.warn { background: var(--warning-bg); color: var(--warning-text); }
.pill.err { background: var(--error-bg); color: var(--error-text); }
.pill.mute { background: #eef2ef; color: var(--ink-mid); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--success); } .dot.off { background: var(--offline); } .dot.err { background: var(--error); } .dot.warn { background: var(--warning); }

/* Segmented */
.seg { display: flex; background: #e8f1eb; border-radius: var(--radius-md); padding: 4px; gap: 4px; }
.seg span { flex: 1; text-align: center; height: 40px; line-height: 40px; border-radius: 9px; font: 600 14px/40px var(--font-sans); color: var(--ink-mid); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg span .ms { font-size: 18px; }
.seg span.on { background: var(--card); color: var(--green-dark); box-shadow: 0 1px 3px rgba(14,46,26,.12); }

/* Lists */
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; }
.row + .row { border-top: 1px solid var(--line); }
.row .r-icon { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--green-wash); color: var(--green-dark); display: flex; align-items: center; justify-content: center; flex: none; }
.row .r-main { flex: 1; min-width: 0; }
.row .r-title { font: 600 16px/22px var(--font-sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r-sub { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r-end { text-align: right; flex: none; }
.row .r-end b { display: block; font: 700 16px/22px var(--font-sans); }
.row .r-end span { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.row .chev { color: var(--ink-muted); flex: none; }

/* Load bar */
.bar { height: 8px; border-radius: var(--radius-pill); background: #e8f1eb; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--green-mid); }
.bar i.mid { background: var(--warning); } .bar i.high { background: var(--error); }

/* Switch */
.switch { width: 52px; height: 32px; border-radius: var(--radius-pill); background: var(--offline); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on { background: var(--green-dark); }
.switch.on::after { left: 24px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: var(--radius-md); font: 600 15px/20px var(--font-sans); border: 1px solid transparent; white-space: nowrap; }
.btn .ms { font-size: 20px; }
.btn.primary { background: var(--green-dark); color: var(--on-brand); }
.btn.tonal { background: var(--green-pale); color: var(--green-dark); }
.btn.outline { background: var(--card); color: var(--green-dark); border-color: #b9d6c3; }
.btn.danger { background: var(--error-text); color: #fff; }
.btn.text { color: var(--green-dark); padding: 0 12px; }
.btn.block { width: 100%; }
.fab { position: absolute; right: 16px; bottom: 92px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; background: var(--green-dark); color: var(--on-brand); display: flex; align-items: center; gap: 8px; font: 600 15px/20px var(--font-sans); box-shadow: 0 6px 16px rgba(26,92,53,.35); z-index: 3; }

/* Inputs */
.field { margin-top: 12px; }
.field label { display: block; font: 600 14px/20px var(--font-sans); color: var(--ink-mid); margin-bottom: 6px; }
.input { height: 52px; border: 1px solid #b9d6c3; border-radius: var(--radius-md); background: var(--card); padding: 0 14px; display: flex; align-items: center; gap: 8px; font: 400 16px/22px var(--font-sans); color: var(--ink); }
.input .ph { color: var(--ink-muted); }
.input .ms { color: var(--ink-muted); font-size: 20px; }
.help { font: 400 13px/18px var(--font-sans); color: var(--ink-muted); margin-top: 6px; }

/* Bottom nav */
.bnav { flex: none; height: 80px; background: var(--card); border-top: 1px solid var(--line); display: flex; padding: 8px 4px 12px; box-shadow: var(--shadow-sheet); position: relative; z-index: 4; }
.bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-mid); font: 500 12px/16px var(--font-sans); text-decoration: none; }
.bnav a .ind { width: 60px; height: 32px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; }
.bnav a.on { color: var(--green-dark); font-weight: 700; }
.bnav a.on .ind { background: var(--green-pale); }
.bnav a.on .ms { font-variation-settings: 'FILL' 1; }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgba(14,46,26,.45); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: var(--radius-xl) var(--radius-xl) 0 0; z-index: 6; box-shadow: var(--shadow-sheet); max-height: 88%; display: flex; flex-direction: column; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: #c6d6cb; margin: 10px auto 4px; flex: none; }
.sheet .s-head { padding: 8px 16px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); flex: none; }
.sheet .s-head h3 { margin: 0; font: 700 20px/26px var(--font-sans); }
.sheet .s-body { padding: 8px 16px 16px; overflow-y: auto; flex: 1; scrollbar-width: none; }
.sheet .s-foot { padding: 12px 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 12px; flex: none; }
.sheet .s-foot .btn { flex: 1; }
.s-label { font: 600 14px/20px var(--font-sans); color: var(--ink-mid); margin: 16px 0 8px; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }

/* Charts */
.chart { width: 100%; display: block; }
.chart text { font: 500 12px var(--font-sans); fill: var(--ink-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font: 500 13px/18px var(--font-sans); color: var(--ink-mid); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font: 600 12px/16px var(--font-sans); color: var(--ink-muted); padding: 0 0 8px; letter-spacing: .2px; }
.tbl td { font: 400 14px/20px var(--font-sans); padding: 10px 0; border-top: 1px solid var(--line); }
.tbl th:not(:first-child), .tbl td:not(:first-child) { text-align: right; }
.tbl td b { font-weight: 600; }

/* Misc */
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--green-wash); font: 400 14px/20px var(--font-sans); color: var(--ink-mid); }
.note .ms { color: var(--green-dark); font-size: 20px; }
.muted { color: var(--ink-muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.reading { background: var(--surface); border-radius: var(--radius-md); padding: 12px; }
.reading span { display: block; font: 500 13px/18px var(--font-sans); color: var(--ink-mid); }
.reading b { font: 700 20px/26px var(--font-sans); }
.reading b small { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); margin-left: 2px; }
.days { display: flex; gap: 6px; }
.days span { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 600 13px/18px var(--font-sans); background: #eef2ef; color: var(--ink-mid); }
.days span.on { background: var(--green-dark); color: var(--on-brand); }
.inst { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font: 700 12px/16px var(--font-sans); color: #fff; flex: none; letter-spacing: .2px; }
.i-ic { background: var(--ic-mid); } .i-ilegg { background: var(--ilegg-mid); } .i-ited { background: var(--ited-dark); } .i-iaas { background: var(--iaas-mid); } .i-admin { background: var(--green-dark); }
.best { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: var(--radius-pill); background: var(--warning-bg); color: var(--warning-text); font: 700 12px/16px var(--font-sans); }
.empty { text-align: center; padding: 32px 16px; color: var(--ink-muted); font: 400 15px/22px var(--font-sans); }

/* Foundation specimens (non-phone cards) */
.spec { padding: 20px 24px; font-family: var(--font-sans); color: var(--ink); background: var(--surface); }
.spec h4 { margin: 0 0 12px; font: 600 13px/18px var(--font-sans); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .6px; }
.spec-row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.spec-row .meta { width: 150px; flex: none; font: 500 13px/18px var(--font-sans); color: var(--ink-mid); }
.spec-row .was { font: 500 12px/16px var(--font-sans); color: var(--error-text); margin-left: auto; white-space: nowrap; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare > div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }

html,body{height:100%}
body{background:#1c2a21;padding-inline:16px;padding-block:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dev .phone{border-color:#0b120e;box-shadow:0 0 0 2px #33443a,0 30px 80px rgba(0,0,0,.5)}
.phone *{-webkit-tap-highlight-color:transparent}
.row[data-go],.row[data-open],[data-go],[data-open],.bnav a,.icon-btn,.chip,.seg span,.switch,.days span,.btn,[data-pick],.signout,.avatar{cursor:pointer}
.row[data-go]:active,.row[data-open]:active,.card[data-go]:active,[data-pick]:active{background:var(--green-wash)}
.r-end{min-width:44px}
.fab.round{width:56px;height:56px;padding:0;justify-content:center;border-radius:16px}
.fab.round .ms{font-size:28px}
.has-fab .content{padding-bottom:96px}
.n-time{font:500 12px/16px var(--font-sans);color:var(--ink-muted);margin-top:4px}
.notif{align-items:flex-start}
.n-msg{font:400 14px/20px var(--font-sans);color:var(--ink-mid);margin-top:2px}
.r-end .pill{display:inline-flex}
.inst{width:48px;font-size:11px;letter-spacing:0}
.content.push{animation:push .2s ease-out} .content.pop{animation:pop .2s ease-out} .content.fade{animation:fade .15s ease-out}
@keyframes push{from{transform:translateX(32px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateX(-32px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(30%)}to{transform:none}}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;font:500 14px/20px var(--font-sans);padding:12px 18px;border-radius:12px;z-index:9;white-space:nowrap}
body.bare{padding:0;background:var(--surface)}
body.bare .dev,body.bare .dev>div{width:100%;height:100%}
body.bare .dev .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
/* Option 1: white background, flat sections */
.dev .phone,.dev .content,body.bare{background:#fff}
.list{border:0;border-radius:0;background:transparent;box-shadow:none;margin-inline:-16px;overflow:visible}
.list .row{position:relative}
.list .row+.row{border-top:0}
.list .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.list .row:has(>.r-icon)+.row::before,.list .row:has(>.inst)+.row::before{left:68px}
.list .row+.row:has(>.r-icon)::before,.list .row+.row:has(>.inst)::before{left:68px}
.card:not(:has(svg)){background:transparent;border:0;border-radius:0;box-shadow:none;padding:16px 0;border-bottom:1px solid var(--line)}
.card:not(:has(svg))+.card{margin-top:0}
.card:has(svg){box-shadow:none}
.kpis{gap:0;border-block:1px solid var(--line)}
.kpi{border:0;border-radius:0;background:transparent;padding:14px 12px 14px 0}
.kpi:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}
.kpi:nth-child(n+3){border-top:1px solid var(--line)}
.reading{background:var(--surface)!important;border:0!important}
.section{margin-top:28px}
.s-label{margin-top:24px}
.sheet .list{margin-inline:-16px}
/* Design pass 2 */
.topbar{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding-top:4px}
.topbar h1{font-size:24px;line-height:30px;letter-spacing:-.2px}
.topbar.small h1{font-size:19px;line-height:24px;font-weight:700}
.topbar .tb-sub{color:var(--ink-muted)}
.topbar .icon-btn{color:var(--ink)}
.topbar .icon-btn .badge{border-color:#fff}
.statusbar.light{background:#fff}
.kpi .k-icon{float:left;width:28px;height:28px;border-radius:8px;margin-right:8px}
.kpi .k-icon .ms{font-size:18px}
.kpi .k-label{margin-top:4px;line-height:20px}
.kpi .k-value{clear:both;padding-top:8px;font-size:24px}
.hero{border-radius:24px;padding:20px 20px 18px}
.hero .h-grid{margin-top:12px}
.bar{height:6px}
.power{display:flex;flex-direction:column;align-items:center;padding:8px 0 20px;border-bottom:1px solid var(--line)}
.pw-btn{width:112px;height:112px;border-radius:50%;border:0;background:var(--green-dark);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px var(--green-wash),0 10px 24px rgba(26,92,53,.3);cursor:pointer;transition:background .2s,box-shadow .2s}
.pw-btn .ms{font-size:48px;width:48px;height:48px}
.pw-btn.off{background:#e3ebe6;color:var(--ink-mid);box-shadow:0 0 0 10px #f3f6f4}
.pw-btn:focus-visible{outline:3px solid var(--green-mid);outline-offset:14px}
.pw-state{font:700 24px/30px var(--font-sans);margin-top:22px}
.pw-meta{display:flex;gap:8px;align-items:center;margin-top:6px;font:500 14px/20px var(--font-sans);color:var(--ink-mid)}
.sched{display:block;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sc-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sc-top .switch{margin-left:auto}
.sc-top b.sc-time{font:700 22px/28px var(--font-sans);letter-spacing:-.3px;white-space:nowrap}
.sched.paused .sc-top b.sc-time{color:var(--ink-muted)}
.sched.paused .sc-time b,.sched.paused .r-title{color:var(--ink-muted)}
.sc-time{width:104px;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.sc-time b{font:700 20px/26px var(--font-sans);letter-spacing:-.3px;white-space:nowrap}
.sc-more{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.sc-main{flex:1;min-width:0}
.sched .r-title{font:600 16px/22px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched .r-sub{font:400 14px/20px var(--font-sans);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days.mini{gap:6px;margin-top:10px}
.days span{flex:none}
.days.mini span{width:30px;height:30px;font-size:12px}
.notif.unread{background:#f4fbf6}
.list .notif.unread::before{display:none}
/* Analytics parity */
.fbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.fbar::-webkit-scrollbar{display:none}
.fchunk{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:14px;background:#fff;font-family:var(--font-sans);color:var(--ink);cursor:pointer;text-align:left}
.fchunk>.ms:first-child{color:var(--green-dark);font-size:20px;width:20px;height:20px}
.fchunk span:not(.ms){display:flex;flex-direction:column}
.fchunk small{font:600 12px/16px var(--font-sans);color:var(--ink-muted)}
.fchunk b{font:700 14px/18px var(--font-sans);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchunk .s18{color:var(--ink-muted)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.xchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--green-pale);color:var(--green-dark);font:600 13px/18px var(--font-sans);cursor:pointer}
.xchip i{font-style:normal;width:20px;height:20px;border-radius:50%;background:rgba(26,92,53,.14);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.seg.mini{padding:3px} .seg.mini span{height:30px;line-height:30px;font-size:13px;padding:0 10px;cursor:pointer}
.seg.dis{opacity:.5;pointer-events:none}
.readout{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:6px;font:500 14px/20px var(--font-sans)}
.readout b{font-weight:700} .readout.muted{font-size:13px}
.legend i.line.dash{height:0;border-top:2.5px dashed #8a9a90;background:none;width:18px}
.cmp-cta{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--green-dark);font:600 14px/20px var(--font-sans);cursor:pointer}
.cmp-cta span:not(.ms){flex:1}
.rank{width:32px;height:32px;border-radius:10px;background:var(--green-wash);color:var(--green-dark);font:700 14px/32px var(--font-sans);text-align:center;flex:none}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.opt .ms{color:var(--ink-muted)} .opt.on .ms{color:var(--green-dark)}
.opt .o-t{display:flex;flex-direction:column;font:500 16px/22px var(--font-sans)}
.opt .o-t small{font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.opt.dis{cursor:default} .opt.dis .o-t{color:var(--ink-disabled)}
.cal{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:8px 10px 12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font:700 16px/22px var(--font-sans)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g i{font:600 12px/28px var(--font-sans);color:var(--ink-muted);font-style:normal}
.cal-g span{height:38px;display:flex;align-items:center;justify-content:center;font:500 14px/1 var(--font-sans);border-radius:10px;cursor:pointer}
.cal-g span.in{background:var(--green-pale);color:var(--green-dark);border-radius:0}
.cal-g span.end{background:var(--green-dark);color:#fff;border-radius:10px}
.cal-g span.fut{color:var(--ink-disabled);cursor:default}
.cal-g span.today{box-shadow:inset 0 0 0 1.5px var(--green-mid)}
.cal-f{font:500 13px/18px var(--font-sans);color:var(--ink-mid);margin-top:8px;text-align:center}
.fstats{margin-top:12px} .fstats .reading{padding:10px} .fstats .reading b{font-size:17px;line-height:22px}
.diff{margin-top:10px;font:500 14px/20px var(--font-sans);color:var(--ink-mid)} .diff b{color:var(--ink)}
.chip i.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.content>div>.note,.section.note{margin-top:20px}
/* Analytics layout v2 */
.an-wrap{margin-top:20px}
.an-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.an-title{min-width:0}
.an-title h2{margin:0;font:700 20px/26px var(--font-sans)}
.an-title .sub{font:400 14px/20px var(--font-sans);color:var(--ink-muted);margin-top:2px}
.an-filter{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;border:1px solid #b9d6c3;background:#fff;color:var(--green-dark);font:600 15px/20px var(--font-sans);cursor:pointer}
.an-filter .cnt{min-width:20px;height:20px;border-radius:999px;background:var(--green-dark);color:#fff;font:700 12px/20px var(--font-sans);text-align:center;padding:0 6px}
.fchips{margin-top:12px}
.an-block{margin-top:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.an-big-l{font:600 14px/20px var(--font-sans);color:var(--ink-mid);display:flex;align-items:center}
.an-big{font:700 40px/46px var(--font-sans);letter-spacing:-.8px;margin-top:4px}
.an-big small{font:500 18px/24px var(--font-sans);color:var(--ink-muted);margin-left:6px;letter-spacing:0}
.an-delta{font:500 14px/20px var(--font-sans);color:var(--ink-mid);margin-top:4px;display:flex;align-items:center;flex-wrap:wrap}
.an-stats{display:grid;grid-template-columns:1fr;margin-top:20px;border-top:1px solid var(--line)}
.an-stat{display:grid;grid-template-columns:1fr auto;column-gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.an-stat:last-child{border-bottom:0;padding-bottom:0}
.an-stat span{font:500 15px/22px var(--font-sans);color:var(--ink-mid)}
.an-stat b{font:700 16px/22px var(--font-sans);text-align:right}
.an-stat small{grid-column:1/-1;font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.an-sec{margin-top:36px}
.an-sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.an-sec-h h3{margin:0;font:700 18px/24px var(--font-sans)}
.an-sec-h .sub{font:400 14px/20px var(--font-sans);color:var(--ink-muted);margin-top:2px}
.chart-card{padding:16px 14px 14px}
.legend.stack{flex-direction:column;gap:6px;margin-top:12px}
.legend.stack b{color:var(--ink);font-weight:600}
.readout{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.readout>div{display:flex;flex-direction:column}
.readout small{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.readout b{font:700 17px/24px var(--font-sans)}
.readout.hint{flex-direction:row;align-items:center;gap:8px;font:500 14px/20px var(--font-sans);color:var(--ink-muted)}
.cmp-cta{margin-top:12px}
.stackbar{display:flex;gap:3px;height:14px;border-radius:999px;overflow:hidden;margin-bottom:6px}
.u-row .sw,.mcol-h .sw,.model-seg .sw{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.u-row{min-height:56px}
.list .u-row+.u-row::before{left:44px}
.model-seg span{gap:8px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcols.one{grid-template-columns:1fr}
.mcol{border:1px solid var(--line);border-radius:16px;padding:14px}
.mcol.best-col{border-color:#b9d6c3;background:#f7fcf8}
.mcol-h{display:flex;align-items:center;gap:8px;font:700 16px/22px var(--font-sans);margin-bottom:6px}
.mcol-h .best{margin-left:auto;height:22px;padding:0 8px}
.mrow{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line)}
.mrow span{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.mrow b{font:700 16px/22px var(--font-sans)}
.verdict{display:flex;gap:10px;margin-top:14px;padding:14px;border-radius:12px;background:var(--green-wash);font:400 14px/21px var(--font-sans);color:var(--ink-mid)}
.verdict .ms{color:var(--green-dark)} .verdict b{color:var(--ink)}
.legend i.line.dash.dot{border-top-style:dotted;border-top-width:3px}
.h-row{min-height:64px}
.h-wd{font-weight:500;color:var(--ink-muted)}
.h-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.h-end b{font:700 16px/22px var(--font-sans)} .h-end b small{font-weight:500;font-size:13px;color:var(--ink-muted)}
.h-end .pill{gap:2px;padding:0 8px 0 6px} .h-end .pill .ms{width:16px;height:16px;font-size:16px}
.hub-row{padding:14px 20px!important;cursor:pointer}
.sheet .list .hub-row::before{display:none}
.hub-row+.hub-row{border-top:1px solid var(--line)!important}
.theme-ic{--green-dark:#534A9C;--green-mid:#7F79D1;--green-light:#7F79D1;--green-pale:#DADBFC;--green-wash:#F4F4FF;--surface:#F4F4FF;--line:#E6E5F5;--chart-arima:#534A9C;--brand-900:#342F64}
.theme-ic .hero{background:linear-gradient(135deg,#342F64,#534A9C)}
.theme-ilegg{--green-dark:#8D325C;--green-mid:#C1628A;--green-light:#C1628A;--green-pale:#F8D2DF;--green-wash:#FEF1F5;--surface:#FEF1F5;--line:#F2E2E9;--chart-arima:#8D325C;--brand-900:#5A203A}
.theme-ilegg .hero{background:linear-gradient(135deg,#5A203A,#8D325C)}
.theme-ited{--green-dark:#8B5500;--green-mid:#B47D06;--green-light:#B47D06;--green-pale:#F6E7BB;--green-wash:#FCF8E8;--surface:#FCF8E8;--line:#F0E6CC;--chart-arima:#8B5500;--brand-900:#542C07}
.theme-ited .hero{background:linear-gradient(135deg,#542C07,#8B5500)}
.theme-ited .h-cell b{color:#FBE3A0}
.theme-iaas{--green-dark:#006095;--green-mid:#0891C9;--green-light:#0891C9;--green-pale:#C2E4F8;--green-wash:#ECF7FE;--surface:#ECF7FE;--line:#DCEAF4;--chart-arima:#006095;--brand-900:#003E5F}
.theme-iaas .hero{background:linear-gradient(135deg,#003E5F,#006095)}
.theme-ited .hero .live i{background:#E8B530}
/* Icon style options (page-level) */
body.ic-neutral .dev .r-icon:not(.ic-warn):not(.ic-err):not([style*="warning"]):not([style*="error"]),body.ic-neutral .dev .kpi .k-icon{background:#F1F3F2!important;color:var(--ink-mid)!important}
body.ic-plain .dev .r-icon:not(.ic-warn):not(.ic-err):not([style*="warning"]):not([style*="error"]),body.ic-plain .dev .kpi .k-icon{background:transparent!important;color:var(--green-dark)!important;width:28px;justify-content:flex-start}
body.ic-plain .dev .list .row:has(>.r-icon)+.row::before,body.ic-plain .dev .list .row+.row:has(>.r-icon)::before{left:56px}
body.ic-outline .dev .r-icon:not(.ic-warn):not(.ic-err):not([style*="warning"]):not([style*="error"]),body.ic-outline .dev .kpi .k-icon{background:#fff!important;box-shadow:inset 0 0 0 1px var(--line);color:var(--green-dark)!important}
.toolbar{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 auto 14px;flex-wrap:wrap}
.toolbar .lbl{font:600 13px/18px var(--font-sans);color:#a9c2b3}
.ipick.vpick{display:none} body.ited .ipick.vpick{display:flex}

.theme-ited .chart rect[fill="var(--warning)"]{fill:#fff;stroke:var(--warning);stroke-width:2.5}
.theme-ited .legend i[style*="--warning"]{background:#fff!important;box-shadow:inset 0 0 0 2px var(--warning)}
.theme-ited .h-cell b{color:#F6D98A}
[class*="theme-"] .pill.ok,[class*="theme-"] .live.on-light{background:#e6f5eb;color:var(--success-text)}
[class*="theme-"] .topbar{box-shadow:inset 0 -3px 0 var(--green-mid)}
[class*="theme-"] .hero .h-label,[class*="theme-"] .hero .h-delta,[class*="theme-"] .hero .h-cell span,[class*="theme-"] .hero .h-value small{color:rgba(255,255,255,.82)}
[class*="theme-"] .live i{background:#6ecb8a}
.pill.brand{background:var(--green-pale);color:var(--green-dark)}
.inst.av{border-radius:50%;background:var(--green-mid);font-size:14px;width:40px}
.r-icon.ic-warn{background:var(--warning-bg);color:var(--warning-text)} .r-icon.ic-err{background:var(--error-bg);color:var(--error-text)}
/* page: two phones */
body{background:#18221c;display:block;overflow:auto;padding-block:16px 24px}
.pair{display:flex;justify-content:center;gap:56px;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.col-h{display:flex;align-items:center;gap:10px;min-height:40px;flex-wrap:wrap;justify-content:center}
.who{font:600 15px/20px var(--font-sans);color:#e8f2ec;display:flex;align-items:center;gap:8px}
.who i{width:10px;height:10px;border-radius:50%;display:inline-block}
.who small{font-weight:400;color:#a9c2b3}
.ipick{display:flex;gap:4px;background:#243129;border-radius:999px;padding:3px}
.ipick button{border:0;background:transparent;color:#cfe0d6;font:600 13px/18px var(--font-sans);height:30px;padding:0 12px;border-radius:999px;cursor:pointer}
.ipick button.on{background:#fff;color:#0e2e1a}
.ipick button:focus-visible{outline:2px solid #6ecb8a;outline-offset:1px}
#view-pick{display:none;margin:0 auto 12px;width:max-content}
body.one #view-pick{display:flex}
body.one .pair{gap:0}
body.one[data-view="main"] .col-inst,body.one[data-view="inst"] .col-main{display:none}
.dev .phone{border-color:#0b120e;box-shadow:0 0 0 2px #33443a,0 30px 80px rgba(0,0,0,.5)}
/* Outline system: themed color on lines and glyphs, never as a fill (except the energy card and solid primary actions) */
.dev .bnav a.on .ind{background:#fff!important;box-shadow:inset 0 0 0 1.5px var(--green-mid)}
.dev .bnav a.on{color:var(--green-dark)}
.dev .chip.on,.dev .xchip{background:#fff!important;border-color:var(--green-dark)!important;box-shadow:inset 0 0 0 .5px var(--green-dark);color:var(--green-dark)!important}
.dev .xchip{border:1px solid var(--green-dark)}
.dev .xchip i{background:transparent;border:1px solid currentColor;width:18px;height:18px}
.dev .pill.brand{background:#fff;box-shadow:inset 0 0 0 1px var(--green-mid);color:var(--green-dark)}
.dev .avatar{background:#fff!important;box-shadow:inset 0 0 0 1.5px var(--green-mid);color:var(--green-dark)!important}
.dev .inst.av{background:#fff;box-shadow:inset 0 0 0 1.5px var(--green-mid);color:var(--green-dark)}
.dev .btn.tonal{background:#fff;border:1px solid var(--green-dark);color:var(--green-dark)}
.dev .reading{background:#fff!important;box-shadow:inset 0 0 0 1px var(--line)}
.dev .note,.dev .verdict,.dev .cmp-cta,.dev .readout{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.dev .notif.unread{background:#fff}
.dev .mcol.best-col{background:#fff;border-color:var(--green-mid);border-width:1.5px}
.dev .rank{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.dev .seg span.on{box-shadow:inset 0 0 0 1.5px var(--green-mid),0 1px 2px rgba(14,46,26,.08)}
.dev .icon-btn .badge{border-color:#fff}
.dev .pw-btn{box-shadow:0 0 0 8px #fff,0 0 0 9.5px var(--line),0 10px 24px rgba(0,0,0,.18)}
.dev .pw-btn.off{box-shadow:0 0 0 8px #fff,0 0 0 9.5px var(--line)}
.dev .cal-g span.in{background:#fff;box-shadow:inset 0 -2px 0 var(--green-pale);border-radius:0}
/* Readable secondary text: two strong levels, no faint grey */
.dev{--ink-mid:#24402E;--ink-muted:#3A5344}
.dev .r-sub,.dev .card-sub,.dev .sec-head .sub,.dev .an-title .sub,.dev .an-sec-h .sub,.dev .tb-sub{color:var(--ink-mid)}
.dev .kpi .k-foot,.dev .r-end span,.dev .n-time,.dev .sc-more,.dev .h-end b small,.dev .readout small,.dev .mrow span,.dev .reading span{font-size:13px;line-height:18px;color:var(--ink-mid)}
.dev .kpi .k-label,.dev .an-stat span,.dev .an-big-l{color:var(--ink)}
.dev .an-stat small,.dev .help,.dev .legend{font-size:13px;color:var(--ink-mid)}
.dev .chart text{fill:#3A5344;font-weight:600}
.dev .muted{color:var(--ink-muted)}
.dev .input .ph{color:#51685A}
.dev .sched.paused .sc-top b.sc-time,.dev .sched.paused .r-title{color:var(--ink-mid)}
.dev .bnav a{color:var(--ink-mid)}
.dev .s-label{color:var(--ink)}
/* Automation v2 */
.au-sec+.au-sec{margin-top:28px}
.au-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}

  /* Bar chart: values, labels; opts {h, hi (index of highlight), peak (index), color, compare[]} */

  /* Donut: parts [[label, value, color]] */
  function donut(parts, center, sub) {
    var total = parts.reduce(function (a, p) { return a + p[1]; }, 0), R = 52, C = 2 * Math.PI * R, off = 0;
    var s = '<svg viewBox="0 0 132 132" width="132" height="132" role="img" style="flex:none">';
    s += '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="#eef2ef" stroke-width="16"/>';
    parts.forEach(function (p) {
      var len = C * p[1] / total;
      s += '<circle cx="66" cy="66" r="' + R + '" fill="none" stroke="' + p[2] + '" stroke-width="16" stroke-dasharray="' + (len - 2) + ' ' + (C - len + 2) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 66 66)"/>';
      off += len;
    });
    s += '<text x="66" y="64" text-anchor="middle" style="font:700 18px Roboto,sans-serif;fill:var(--ink)">' + center + '</text>';
    s += '<text x="66" y="82" text-anchor="middle" style="font:500 12px Roboto,sans-serif;fill:var(--ink-muted)">' + sub + '</text>';
    return s + '</svg>';
  }

  function kpi(ic, label, value, unit, foot, footCls) {
    return '<div class="kpi"><div class="k-icon">' + icon(ic) + '</div><div class="k-label">' + label + '</div>' +
      '<div class="k-value">' + value + (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      (foot ? '<div class="k-foot ' + (footCls || '') + '">' + foot + '</div>' : '') + '</div>';
  }

  window.SPS = { icon: icon, phone: phone, mount: mount, bars: bars, line: line, donut: donut, kpi: kpi, topbar: topbar, bnav: bnav, statusbar: statusbar };
})();
</script>

/* ---- Resizable device: size is the SCREEN in dp; the 8px bezel is added around it ---- */
var BEZEL = 8;
function applySize(host, ph) {
  if (!host._size) host._size = [360, 800];
  ph.style.width = (host._size[0] + BEZEL * 2) + 'px'; ph.style.height = (host._size[1] + BEZEL * 2) + 'px';
  if (host._ro) host._ro.disconnect();
  if (window.ResizeObserver) {
    host._ro = new ResizeObserver(function () {
      var w = Math.round(ph.offsetWidth - BEZEL * 2), h = Math.round(ph.offsetHeight - BEZEL * 2);
      if (!w || !h) return;
      host._size = [w, h];
      var lbl = document.getElementById(host.id + '-size'); if (lbl) lbl.textContent = w + ' × ' + h + ' dp';
      if (window.fitSoon) window.fitSoon();
    });
    host._ro.observe(ph);
  }
}
